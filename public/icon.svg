<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background container with sleek rounded rect -->
  <rect width="32" height="32" rx="7" fill="url(#bg-grad)"/>
  <rect width="32" height="32" rx="7" fill="url(#glow-grad)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Receipt paper silhouette -->
  <path d="M8 6C8 5.44772 8.44772 5 9 5H23C23.5523 5 24 5.44772 24 6V25.5L21.5 24L19 25.5L16 24L13 25.5L10.5 24L8 25.5V6Z" fill="#1b222d" stroke="url(#emerald-grad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Receipt horizontal lines -->
  <line x1="11" y1="9.5" x2="21" y2="9.5" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="11" y1="13" x2="16" y2="13" stroke="#4b5563" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Shield / Lock Check emblem in center-bottom -->
  <circle cx="16" cy="18" r="4.5" fill="#0d1117" stroke="#10b981" stroke-width="1.2"/>
  <path d="M14 18L15.3 19.3L18 16.5" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
